# 로그 레벨 (debug, info, warn, error)
logLevel: info

# API
api: yes
apiAddress: :9997

# SRT (외부 스트림 수신)
srt: yes
srtAddress: :8890

# WebRTC (프론트엔드 실시간 스트리밍)
webrtc: yes
webrtcAddress: :8889
webrtcICEUDPMuxAddress: :8189
webrtcAdditionalHosts: [127.0.0.1]

# RTSP (Python 프레임 캡처용)
rtsp: yes
rtspAddress: :8554

# HLS (Spring 클립 추출용)
hls: yes
hlsAddress: :8888
hlsVariant: fmp4
hlsSegmentDuration: 3s
hlsSegmentCount: 10
hlsSegmentMaxSize: 10M
hlsDirectory: /recordings

# 미사용
rtmp: no

# 인증 (Spring 위임)
authMethod: http
authHTTPAddress: http://host.docker.internal:8080/internal/mediamtx/auth

# 스트림 시작/종료 시 Spring에 동기화 트리거
paths:
  all:
    runOnReady: curl -s -X POST http://host.docker.internal:8080/internal/mediamtx/sync
    runOnReadyRestart: no
    runOnNotReady: curl -s -X POST http://host.docker.internal:8080/internal/mediamtx/sync