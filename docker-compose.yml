services:
  # 리버스 프록시
  caddy:
    image: caddy:latest
    container_name: aegis-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - aegis

  # 미디어 서버
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    image: aegis-mediamtx:latest
    container_name: aegis-mediamtx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9997:9997"       # API
      - "8890:8890/udp"   # SRT
      - "8889:8889"       # WebRTC WHEP
      - "8189:8189/udp"   # WebRTC ICE
      - "8554:8554"       # RTSP
      - "8888:8888"       # HLS
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    networks:
      - aegis

  # 데이터베이스
  postgres:
    image: postgres:latest
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: trillion
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks:
      - aegis

  # 오브젝트 스토리지
  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aegis
      MINIO_ROOT_PASSWORD: trillion
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # 웹 콘솔
    volumes:
      - ./minio_data:/data
    networks:
      - aegis

  # 캐시
  redis:
    image: redis:latest
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - aegis

networks:
  aegis:
    name: aegis